services:
  app:
    build: .
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - DATA_DIR=/data
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - BASE_URL=${BASE_URL:-}
    restart: unless-stopped
