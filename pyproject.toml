[project]
name = "jb-rpg"
version = "0.1.0"
description = "TTRPG companion app: build story-driven adventures and run them with players on their phones"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.26.0",
    "pytest>=8.0.0",
]
