<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Editor - J&amp;B's RPG</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .editor-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: calc(100vh - 60px);
        }
        .sidebar {
            background: var(--bg-secondary);
            padding: var(--space-md);
            border-right: 1px solid var(--text-secondary);
            overflow-y: auto;
        }
        .sidebar__section {
            margin-bottom: var(--space-lg);
        }
        .sidebar__title {
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .scene-list {
            list-style: none;
        }
        .scene-item {
            padding: var(--space-sm);
            margin-bottom: var(--space-xs);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scene-item:hover {
            background: var(--bg-primary);
        }
        .scene-item--active {
            background: var(--accent);
            color: white;
        }
        .scene-item__delete {
            opacity: 0;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
        }
        .scene-item:hover .scene-item__delete {
            opacity: 1;
        }
        .main-panel {
            padding: var(--space-lg);
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: var(--space-lg);
        }
        .form-group label {
            display: block;
            margin-bottom: var(--space-xs);
            font-weight: 500;
        }
        textarea.input {
            min-height: 120px;
            resize: vertical;
        }
        .choice-block {
            background: var(--bg-primary);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-md);
        }
        .choice-block--damage { border-left: 4px solid var(--danger); }
        .choice-block--item { border-left: 4px solid var(--success); }
        .choice-block--level { border-left: 4px solid var(--warning); }
        .choice-header {
            display: flex;
            gap: var(--space-md);
            margin-bottom: var(--space-sm);
            align-items: center;
        }
        .conditional-row {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
            align-items: center;
        }

        .conditional-row > select,
        .conditional-row > input[type="number"] {
            width: auto;
            min-width: 80px;
        }

        .conditional-row > input[type="text"],
        .conditional-row > input:not([type]) {
            flex: 1;
            min-width: 150px;
        }

        .conditional-row > .btn {
            flex-shrink: 0;
        }
        .theme-picker {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }
        .theme-btn {
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            border: 2px solid;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: capitalize;
            background: transparent;
            transition: all 0.2s;
        }
        .theme-btn--cyberpunk { border-color: #0ff; color: #0ff; }
        .theme-btn--cyberpunk:hover, .theme-btn--cyberpunk.theme-btn--active { background: #0ff; color: #000; }
        .theme-btn--fantasy { border-color: #d4a574; color: #d4a574; }
        .theme-btn--fantasy:hover, .theme-btn--fantasy.theme-btn--active { background: #d4a574; color: #1a1410; }
        .theme-btn--deep_space { border-color: #9d4edd; color: #9d4edd; }
        .theme-btn--deep_space:hover, .theme-btn--deep_space.theme-btn--active { background: #9d4edd; color: #fff; }
        .theme-btn--modern { border-color: #667eea; color: #667eea; }
        .theme-btn--modern:hover, .theme-btn--modern.theme-btn--active { background: #667eea; color: #fff; }
        .theme-btn--horror { border-color: #8b0000; color: #8b0000; }
        .theme-btn--horror:hover, .theme-btn--horror.theme-btn--active { background: #8b0000; color: #fff; }
        .nav-link {
            display: block;
            padding: var(--space-sm);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .nav-link:hover {
            background: var(--bg-primary);
        }
        .actions {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-lg);
        }
        .save-toast {
            position: fixed;
            bottom: var(--space-lg);
            right: var(--space-lg);
            background: var(--success);
            color: white;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .save-toast--visible {
            opacity: 1;
        }
        .scene-item--drag-over {
            border-top: 2px solid var(--accent);
        }
        .scene-item--dragging {
            opacity: 0.5;
        }

        /* Preset system styles */
        .preset-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }
        .preset-chip {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-xs) var(--space-sm);
            background: var(--bg-primary);
            border: 1px solid var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .preset-chip:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        .preset-chip--custom {
            border-style: dashed;
        }
        .preset-chip__delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
            opacity: 0.7;
        }
        .preset-chip__delete:hover {
            opacity: 1;
        }

        /* Mad lib field editor styles */
        .madlib-fields-scroll {
            max-height: 500px;
            overflow-y: auto;
            padding-right: var(--space-sm);
        }
        .madlib-field-card {
            margin-bottom: var(--space-md);
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .madlib-field-header {
            background: var(--bg-secondary);
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--text-secondary);
        }
        .madlib-field-key {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--accent);
        }
        .madlib-field-body {
            padding: var(--space-md);
        }
        .madlib-field-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: var(--space-xs);
        }
    </style>
</head>
<body>
    <nav class="nav" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
        <div style="display: flex; gap: var(--space-sm); align-items: center;">
            <a href="/" class="nav__title">J&amp;B's RPG</a>
            <a href="/" class="btn btn--secondary">Library</a>
        </div>
        <span id="story-name" style="font-weight: 600; font-size: 1.1rem;"></span>
        <div style="display: flex; gap: var(--space-sm); align-items: center; justify-content: flex-end;">
            <button class="btn btn--secondary mode-toggle" onclick="ThemeManager.toggleMode()" title="Toggle light/dark mode"></button>
        </div>
    </nav>

    <div class="editor-layout">
        <aside class="sidebar">
            <div class="sidebar__section">
                <div class="sidebar__title">Scenes</div>
                <ul id="scene-list" class="scene-list"></ul>
                <button class="btn" style="width: 100%; margin-top: var(--space-sm);" onclick="addScene()">+ Add Scene</button>
            </div>
            <div class="sidebar__section">
                <div class="sidebar__title">Setup</div>
                <a class="nav-link" onclick="showMadlibEditor(); return false;">Mad Libs Template</a>
                <a class="nav-link" onclick="showSettings(); return false;">Story Settings</a>
            </div>
        </aside>

        <main id="main-panel" class="main-panel">
            <p style="color: var(--text-secondary);">Select a scene to edit, or create a new one.</p>
        </main>
    </div>

    <div id="save-toast" class="save-toast">Story saved!</div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/editor.js"></script>
</body>
</html>
