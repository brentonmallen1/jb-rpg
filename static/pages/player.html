<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player View - J&amp;B's RPG</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        .player-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            text-align: center;
        }
        .character-section {
            cursor: pointer;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            transition: background 0.2s;
        }
        .character-section:hover {
            background: var(--bg-secondary);
        }
        .character-name {
            font-size: 2rem;
            font-weight: bold;
            font-family: var(--font-display);
            margin-bottom: var(--space-sm);
        }
        .character-section:hover .character-name {
            color: var(--accent);
        }
        .character-description-preview {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 400px;
        }
        .hp-section {
            margin-bottom: var(--space-xl);
            text-align: center;
        }
        .hp-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .hp-display {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
        }
        .hp-display .hp-indicator {
            width: 48px;
            height: 48px;
            font-size: 2rem;
        }
        .stats {
            display: flex;
            gap: var(--space-xl);
            margin-bottom: var(--space-xl);
        }
        .stat-block {
            text-align: center;
        }
        .stat-block__value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
        }
        .stat-block__label {
            color: var(--text-secondary);
        }
        .items-list {
            list-style: none;
            margin-bottom: var(--space-xl);
            max-width: 300px;
        }
        .items-list li {
            padding: var(--space-sm);
            border-bottom: 1px solid var(--bg-secondary);
        }
        .progress-bar {
            width: 100%;
            max-width: 300px;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: var(--space-sm);
        }
        .progress-bar__fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .waiting-state {
            color: var(--text-secondary);
            font-size: 1.25rem;
        }
        .status-message {
            margin-top: var(--space-lg);
            font-size: 1.25rem;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }
        .modal__content {
            background: var(--bg-secondary);
            padding: var(--space-xl);
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
        }
        .modal__content h2 {
            margin-bottom: var(--space-md);
        }
        .modal__content p {
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .modal--hidden {
            display: none;
        }
        .mode-toggle {
            position: fixed;
            top: var(--space-md);
            right: var(--space-md);
        }

        /* Finale styles */
        .finale-section {
            margin-top: var(--space-lg);
        }
        .finale-outcome {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: var(--space-lg);
        }
        .finale-outcome--victory {
            color: var(--success);
        }
        .finale-outcome--defeat {
            color: var(--danger);
        }
        .finale-roll-info {
            background: var(--bg-secondary);
            padding: var(--space-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            line-height: 1.8;
        }
        .finale-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-xl);
            margin-bottom: var(--space-md);
        }
        .finale-stat {
            text-align: center;
        }
        .finale-stat__value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }
        .finale-stat__label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .finale-items {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Revealed choices */
        .revealed-choices {
            margin-top: var(--space-lg);
            width: 100%;
            max-width: 400px;
        }
        .revealed-choices__header {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--space-md);
        }
        .revealed-choice {
            background: var(--bg-secondary);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-sm);
            text-align: left;
            border-left: 3px solid var(--accent);
        }

        /* Character creation header */
        .creation-header {
            margin-bottom: var(--space-xl);
            text-align: center;
        }
        .waiting-message {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-style: italic;
        }
        /* Character creation footer */
        .creation-footer {
            margin-top: var(--space-xl);
            text-align: center;
        }
        .creation-message {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <button class="btn btn--secondary mode-toggle" onclick="ThemeManager.toggleMode()" title="Toggle light/dark mode"></button>

    <div id="player-view" class="player-layout">
        <div class="waiting-state">
            <p>Waiting for storyteller to start...</p>
        </div>
    </div>

    <div id="character-modal" class="modal modal--hidden" onclick="closeModal()">
        <div class="modal__content" onclick="event.stopPropagation()">
            <h2 id="modal-name"></h2>
            <p id="modal-description"></p>
            <button class="btn btn--secondary" style="margin-top: var(--space-lg);" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/sse.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/player.js"></script>
</body>
</html>
