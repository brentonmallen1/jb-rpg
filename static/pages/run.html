<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Story - J&amp;B's RPG</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        .run-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--text-secondary);
            flex-wrap: wrap;
            gap: var(--space-md);
        }
        .status-bar__left, .status-bar__right {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
        }
        .stat {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .scene-panel {
            flex: 1;
            padding: var(--space-xl);
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .scene-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
        }
        .scene-text {
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: var(--space-xl);
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        .choice-btn {
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            border: 2px solid;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s;
            font-family: var(--font-body);
        }
        .choice-btn:hover {
            transform: translateX(4px);
        }
        .choice-btn--damage {
            border-color: var(--danger);
        }
        .choice-btn--item {
            border-color: var(--success);
        }
        .choice-btn--level {
            border-color: var(--warning);
        }
        .choice-outcome {
            font-size: 0.875rem;
            opacity: 0.8;
            margin-top: 4px;
        }
        .controls {
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-secondary);
            border-top: 1px solid var(--text-secondary);
            display: flex;
            gap: var(--space-md);
            align-items: center;
        }
        .madlib-view {
            text-align: center;
            padding: var(--space-xl);
        }
        .madlib-prompt {
            font-size: 1.5rem;
            margin-bottom: var(--space-lg);
        }
        .madlib-input {
            font-size: 1.25rem;
            max-width: 400px;
            margin: 0 auto var(--space-lg);
            display: block;
        }
        .madlib-answers {
            margin-top: var(--space-xl);
            color: var(--text-secondary);
        }
        .finale-view {
            text-align: center;
            padding: var(--space-xl);
        }
        .finale-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-xl);
            margin: var(--space-xl) 0;
        }
        .finale-stat {
            text-align: center;
        }
        .finale-stat__value {
            font-size: 2rem;
            font-weight: bold;
        }
        .finale-stat__label {
            color: var(--text-secondary);
        }
        .roll-info {
            background: var(--bg-secondary);
            padding: var(--space-lg);
            border-radius: var(--radius-md);
            margin: var(--space-xl) auto;
            max-width: 400px;
            line-height: 2;
        }
        .outcome-victory {
            color: var(--success);
            font-size: 2.5rem;
            font-weight: bold;
            margin: var(--space-lg) 0;
        }
        .outcome-defeat {
            color: var(--danger);
            font-size: 2.5rem;
            font-weight: bold;
            margin: var(--space-lg) 0;
        }
        .character-reveal {
            text-align: center;
            padding: var(--space-xl);
        }
        .character-description {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto var(--space-xl);
            line-height: 1.7;
        }
        .previous-scene {
            margin-top: var(--space-xl);
            padding: var(--space-md);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .connected-count {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .hp-display {
            display: flex;
            gap: var(--space-xs);
        }
    </style>
</head>
<body>
    <div class="run-layout">
        <div class="status-bar">
            <div class="status-bar__left">
                <strong id="story-title">Loading...</strong>
                <div class="stat hp-display" id="hp-display"></div>
                <div class="stat">Level <strong id="level-display">1</strong></div>
                <div class="stat">Items <strong id="items-count">0</strong></div>
            </div>
            <div class="status-bar__right">
                <span id="scene-progress">Scene 1 of 1</span>
                <span id="connected-count" class="connected-count"></span>
            </div>
        </div>

        <main id="main-content" class="scene-panel">
            <p>Loading...</p>
        </main>

        <div class="controls" id="controls">
            <button class="btn btn--secondary" onclick="goBack()">Back</button>
            <button class="btn btn--danger" onclick="restart()">Restart</button>
            <details style="margin-left: auto;">
                <summary style="cursor: pointer; color: var(--text-secondary);">Character</summary>
                <div id="character-ref" style="padding: var(--space-md); max-width: 400px; color: var(--text-secondary);"></div>
            </details>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/sse.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/run.js"></script>
</body>
</html>
